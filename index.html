<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HemFix – Home Services Marketplace</title>
<link rel="stylesheet" href="style.css"></head><body>
<header>
<span class="logo">Hem<b>Fix</b></span>
<select id="reg"></select><select id="city"></select>
<input id="q" type="search" autocomplete="off" list="sug">
<datalist id="sug"></datalist>
<select id="lang"><option value="en">English</option><option value="sv">Svenska</option><option value="ne">नेपाली</option><option value="hi">हिंदी</option><option value="ar">العربية</option></select>
<button class="btn o" id="auth"></button>
<button class="btn o" id="role"></button>
<button class="btn" id="cartb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"/></svg><span class="badge" id="cnt">0</span></button>
</header>
<main id="app"></main>
<aside class="drawer" id="drawer"></aside>
<button class="cartbar" id="cbar" style="display:none" onclick="$('#drawer').classList.add('on')"></button>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ui.js"></script>
<script src="data.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script></body></html>
